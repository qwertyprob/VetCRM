services:
  vetassistant:
    build:
      context: ../..
      target: production
      args:
        RAILS_ENV: production
    container_name: vetassistant
    restart: unless-stopped

    environment:
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      DB_HOST: vetassistant-db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SOLID_QUEUE_IN_PUMA: "false"
      JOB_CONCURRENCY: ${JOB_CONCURRENCY:-3}

    ports:
      - "80:80"

    volumes:
      - storage-vetassistant:/rails/storage

    depends_on:
      vetassistant-db:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  vetassistant-db:
    image: postgres:16
    container_name: vetassistant-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: vetassist_prod

    volumes:
      - pgdata-vetassistant:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d vetassist_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pgdata-vetassistant:
  storage-vetassistant:
